name: Qualify DocumentDB macOS ARM64
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'builds/documentdb/build-macos.sh'
      - '.github/workflows/qualify-documentdb-macos.yml'
permissions:
  contents: read
concurrency:
  group: documentdb-macos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Build pinned GA native bundle
        run: bash builds/documentdb/build-macos.sh "$RUNNER_TEMP/documentdb-build"
      - name: Install pinned qualification client
        run: npm install --prefix "$RUNNER_TEMP/documentdb-driver" --ignore-scripts --no-audit --no-fund mongodb@7.7.0
      - name: Relocate and qualify native runtime
        run: |
          mkdir -p "$RUNNER_TEMP/relocated bundle"
          tar -xzf "$RUNNER_TEMP/documentdb-build/documentdb-1.0.0-darwin-arm64.tar.gz" -C "$RUNNER_TEMP/relocated bundle"
          MONGODB_MODULE_PATH="$RUNNER_TEMP/documentdb-driver/node_modules/mongodb" node builds/documentdb/smoke-test.ts "$RUNNER_TEMP/relocated bundle/documentdb"
      - uses: actions/upload-artifact@v4
        with:
          name: documentdb-1.0.0-darwin-arm64
          path: |
            ${{ runner.temp }}/documentdb-build/documentdb-1.0.0-*.tar.gz
            ${{ runner.temp }}/documentdb-build/documentdb-1.0.0-*.sha256
          if-no-files-found: error
          retention-days: 14
