name: Release PostgreSQL

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'PostgreSQL version'
        required: true
        type: choice
        options:
          - 19.0.0-beta.3
          - 19.0.0-beta.1
          - 18.6.0
          - 18.4.0
          - 18.1.0
          - 17.11.0
          - 17.10.0
          - 17.7.0
          - 16.15.0
          - 16.14.0
          - 16.11.0
          - 15.19.0
          - 15.18.0
          - 15.15.0
        default: 19.0.0-beta.3
      platforms:
        description: 'Platforms to build'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'linux-x64'
          - 'linux-arm64'
          - 'darwin-x64'
          - 'darwin-arm64'
          - 'win32-x64'
      dry_run:
        description: 'Build and smoke-test only: no GitHub release, no R2 upload, no releases.json change'
        required: false
        default: false
        type: boolean

# Every job that publishes anything (mirror-postgis-sources, release,
# upload-to-r2, update-releases) carries `if: ${{ !inputs.dry_run }}`, so a
# dry run stops after the build, the smoke gates and dry-run-checks. The
# negation fails closed: anything but a real boolean false skips publishing.
# tests/postgresql-postgis.test.ts pins these gates.

# Prevent concurrent runs that could conflict when updating releases.json
concurrency:
  group: release-postgresql-${{ github.event.inputs.version }}
  cancel-in-progress: false

jobs:
  # Validate version against databases.json
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate version against databases.json
        run: |
          VERSION="${{ github.event.inputs.version }}"
          DB="postgresql"

          echo "Validating PostgreSQL version: $VERSION"

          # A version is enabled if its value is `true` or an object without `"enabled": false`
          ENABLED=$(jq -r "
            .databases.$DB.versions[\"$VERSION\"] // null
            | if . == null or . == false then \"false\"
              elif type == \"object\" and .enabled == false then \"false\"
              else \"true\"
            end
          " databases.json)
          if [ "$ENABLED" != "true" ]; then
            echo "::error::Version '$VERSION' is not enabled in databases.json"
            echo ""
            echo "Available versions:"
            jq -r "
              .databases.$DB.versions | to_entries
              | map(select(.value == true or ((.value | type) == \"object\" and (.value.enabled // true) == true)))
              | .[].key
            " databases.json
            exit 1
          fi

          echo "✓ Version $VERSION is enabled in databases.json"

      - name: Validate sources.json exists
        run: |
          DB="postgresql"
          if [ ! -f "builds/$DB/sources.json" ]; then
            echo "::error::Missing builds/$DB/sources.json"
            exit 1
          fi
          echo "✓ builds/$DB/sources.json exists"

      - name: Validate version in sources.json
        run: |
          VERSION="${{ github.event.inputs.version }}"
          DB="postgresql"

          HAS_VERSION=$(jq -r ".versions[\"$VERSION\"] // empty" "builds/$DB/sources.json")
          if [ -z "$HAS_VERSION" ]; then
            echo "::error::Version '$VERSION' not found in builds/$DB/sources.json"
            echo ""
            echo "Available versions in sources.json:"
            jq -r ".versions | keys[]" "builds/$DB/sources.json"
            exit 1
          fi

          echo "✓ Version $VERSION found in sources.json"

  # Determine which platforms to build based on input
  prepare:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      source_version: ${{ steps.parse-version.outputs.source_version }}
    steps:
      - uses: actions/checkout@v6

      - name: Parse version for source download
        id: parse-version
        run: |
          # databases.json uses 3-part versions (18.1.0) but PostgreSQL source uses 2-part (18.1)
          VERSION="${{ github.event.inputs.version }}"
          # Prereleases map to upstream's compact form (19.0.0-beta.1 -> 19beta1);
          # otherwise remove trailing .0 (18.1.0 -> 18.1)
          if [[ "$VERSION" =~ ^([0-9]+)\.0\.0-(alpha|beta|rc)\.([0-9]+)$ ]]; then
            SOURCE_VERSION="${BASH_REMATCH[1]}${BASH_REMATCH[2]}${BASH_REMATCH[3]}"
          else
            SOURCE_VERSION=$(echo "$VERSION" | sed 's/\.0$//')
          fi
          echo "source_version=$SOURCE_VERSION" >> $GITHUB_OUTPUT
          echo "Source version: $SOURCE_VERSION (from $VERSION)"

      - name: Set build matrix
        id: set-matrix
        run: |
          VERSION="${{ github.event.inputs.version }}"
          PLATFORMS="${{ github.event.inputs.platforms }}"

          # Full platform -> runner/build_type mapping
          FULL_MATRIX='[
            {"platform": "linux-x64", "runner": "ubuntu-latest", "build_type": "docker"},
            {"platform": "linux-arm64", "runner": "ubuntu-latest", "build_type": "docker"},
            {"platform": "darwin-x64", "runner": "macos-15-intel", "build_type": "native"},
            {"platform": "darwin-arm64", "runner": "macos-14", "build_type": "native"},
            {"platform": "win32-x64", "runner": "ubuntu-latest", "build_type": "download"}
          ]'

          # Platforms available for this version: prefer the version-level
          # `platforms` override (e.g. PG19 beta omits win32-x64), fall back to
          # the engine-level list. Existing versions (value `true`) fall back
          # to the engine list, so their behavior is unchanged.
          ALLOWED=$(jq -c --arg v "$VERSION" '
            .databases.postgresql as $pg
            | (($pg.versions[$v] | objects | .platforms) // $pg.platforms)
          ' databases.json)
          echo "Platforms available for $VERSION: $ALLOWED"

          if [ "$PLATFORMS" = "all" ]; then
            # Build every platform available for this version
            MATRIX=$(echo "$FULL_MATRIX" | jq -c --argjson allowed "$ALLOWED" \
              '[ .[] | select(.platform as $p | $allowed | index($p)) ]')
          else
            # Single platform - must be available for this version
            IS_ALLOWED=$(echo "$ALLOWED" | jq -r --arg p "$PLATFORMS" 'index($p) != null')
            if [ "$IS_ALLOWED" != "true" ]; then
              echo "::error::Platform '$PLATFORMS' is not available for version $VERSION"
              echo "Available platforms: $ALLOWED"
              exit 1
            fi
            MATRIX=$(echo "$FULL_MATRIX" | jq -c --arg p "$PLATFORMS" \
              '[ .[] | select(.platform == $p) ]')
            if [ "$MATRIX" = "[]" ]; then
              echo "::error::Unsupported platform: $PLATFORMS"
              echo "Valid platforms: linux-x64, linux-arm64, darwin-x64, darwin-arm64, win32-x64, all"
              exit 1
            fi
          fi

          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "Building platforms: $MATRIX"

  # Build each platform in parallel
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Set up QEMU for cross-platform Docker builds (required for linux-arm64 on x64 runners)
      - name: Set up QEMU
        if: matrix.build_type == 'docker'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: matrix.build_type == 'docker'
        uses: docker/setup-buildx-action@v4

      # Check if there's a download URL available in sources.json
      - name: Check for download URL
        if: matrix.build_type == 'docker'
        id: check-download
        run: |
          VERSION="${{ github.event.inputs.version }}"
          PLATFORM="${{ matrix.platform }}"

          URL=$(jq -r ".versions[\"$VERSION\"][\"$PLATFORM\"].url // empty" builds/postgresql/sources.json)
          SOURCE_TYPE=$(jq -r ".versions[\"$VERSION\"][\"$PLATFORM\"].sourceType // empty" builds/postgresql/sources.json)

          if [ -n "$URL" ] && [ "$SOURCE_TYPE" != "build-required" ]; then
            echo "Found download URL for $PLATFORM: $URL"
            echo "has_url=true" >> $GITHUB_OUTPUT
            echo "url=$URL" >> $GITHUB_OUTPUT
            echo "source_type=$SOURCE_TYPE" >> $GITHUB_OUTPUT
          else
            echo "No download URL found, will build from source"
            echo "has_url=false" >> $GITHUB_OUTPUT
          fi

      # For Linux ARM64: download pre-built binary if URL available (Percona)
      - name: Download for Linux ARM64 (Percona)
        if: matrix.build_type == 'docker' && steps.check-download.outputs.has_url == 'true'
        id: download-linux-arm64
        run: |
          VERSION="${{ github.event.inputs.version }}"
          PLATFORM="${{ matrix.platform }}"
          URL="${{ steps.check-download.outputs.url }}"
          SOURCE_TYPE="${{ steps.check-download.outputs.source_type }}"

          echo "Downloading PostgreSQL $VERSION for $PLATFORM from $SOURCE_TYPE"
          echo "URL: $URL"

          mkdir -p dist/downloads dist/temp

          # Download with retry
          for i in 1 2 3; do
            if curl -fsSL "$URL" -o "dist/downloads/postgresql-original.tar.gz"; then
              echo "Download succeeded"
              break
            fi
            echo "Download attempt $i failed, retrying..."
            sleep $((2**i))
          done

          if [ ! -f "dist/downloads/postgresql-original.tar.gz" ]; then
            echo "::error::Failed to download binary"
            exit 1
          fi

          # Extract and repackage
          cd dist/temp
          tar -xzf ../downloads/postgresql-original.tar.gz

          # Verify extracted layout - Percona extracts to multiple dirs including percona-postgresqlXX
          echo "Extracted contents:"
          ls -la

          # Find the PostgreSQL directory (Percona uses percona-postgresql{major_version} naming)
          # e.g., percona-postgresql18, percona-postgresql17, etc.
          EXTRACTED_DIR=$(ls -d percona-postgresql[0-9]* 2>/dev/null | head -1)

          if [ -z "$EXTRACTED_DIR" ]; then
            # Fallback to other patterns
            EXTRACTED_DIR=$(ls -d percona-postgresql-* 2>/dev/null | head -1)
          fi

          if [ -z "$EXTRACTED_DIR" ]; then
            EXTRACTED_DIR=$(ls -d postgresql-* 2>/dev/null | head -1)
          fi

          if [ -z "$EXTRACTED_DIR" ]; then
            echo "::error::Could not find PostgreSQL directory in tarball"
            echo "Contents:"
            find . -maxdepth 2 -type d
            exit 1
          fi

          echo "Found PostgreSQL directory: $EXTRACTED_DIR"
          mv "$EXTRACTED_DIR" postgresql

          # Clean up other Percona components we don't need
          rm -rf percona-etcd percona-haproxy percona-patroni percona-perl \
                 percona-pgbackrest percona-pgbadger percona-pgbouncer \
                 percona-pgpool-II percona-python3 percona-tcl 2>/dev/null || true

          # Add metadata
          cat > postgresql/.hostdb-metadata.json << EOF
          {
            "name": "postgresql",
            "version": "${VERSION}",
            "platform": "${PLATFORM}",
            "source": "${SOURCE_TYPE}",
            "sourceUrl": "${URL}",
            "rehosted_by": "hostdb",
            "rehosted_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

          # Verify key binaries exist
          if [ ! -f "postgresql/bin/postgres" ]; then
            echo "::error::postgres binary not found"
            find . -name "postgres" -type f 2>/dev/null || echo "No postgres binary found anywhere"
            exit 1
          fi

          # Verify architecture
          ARCH=$(file postgresql/bin/postgres)
          echo "Binary architecture: $ARCH"
          if [[ "$ARCH" != *"aarch64"* ]] && [[ "$ARCH" != *"ARM64"* ]] && [[ "$ARCH" != *"arm64"* ]]; then
            echo "::error::Binary is not ARM64 architecture!"
            exit 1
          fi
          echo "✓ Verified ARM64 architecture"

          # Fix RPATH on all ELF binaries to use $ORIGIN-relative paths
          # This ensures binaries find their bundled libraries regardless of install location
          echo "Installing patchelf..."
          sudo apt-get update && sudo apt-get install -y patchelf

          echo "Fixing RPATH on binaries..."
          find postgresql/bin -type f -executable | while read bin; do
            if file "$bin" | grep -q "ELF"; then
              echo "  Fixing RPATH: $bin"
              patchelf --set-rpath '$ORIGIN/../lib' "$bin" 2>/dev/null || true
            fi
          done

          find postgresql/lib -name "*.so*" -type f 2>/dev/null | while read lib; do
            if file "$lib" | grep -q "ELF"; then
              echo "  Fixing RPATH: $lib"
              patchelf --set-rpath '$ORIGIN' "$lib" 2>/dev/null || true
            fi
          done

          # Create tarball (use full VERSION for artifact naming, e.g., 18.1.0)
          tar -czvf "../postgresql-${VERSION}-${PLATFORM}.tar.gz" postgresql

          cd ..
          rm -rf temp downloads

          echo "Download and repackage complete:"
          ls -la .

      # For Linux: use Docker-based source builds (when no download URL available)
      - name: Build for Linux (Docker)
        if: matrix.build_type == 'docker' && steps.check-download.outputs.has_url != 'true'
        id: build-linux
        timeout-minutes: 120
        run: |
          VERSION="${{ github.event.inputs.version }}"
          PLATFORM="${{ matrix.platform }}"

          echo "Building PostgreSQL $VERSION for $PLATFORM"

          ./builds/postgresql/build-local.sh \
            --version "$VERSION" \
            --platform "$PLATFORM" \
            --output ./dist \
            --cleanup

          # Check if artifact was created
          shopt -s nullglob
          FILES=(./dist/postgresql-*.tar.gz)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "::error::No artifact created for $PLATFORM"
            exit 1
          fi
          ls -la ./dist/

      # pg_cron ships inside the standard build wherever pg-cron.sh scopes it
      # in. Those archives must run a real scheduled job, survive a restart and
      # skip a stopped interval before anything is uploaded.
      - name: Verify pg_cron in the archive
        if: matrix.build_type == 'docker' && steps.check-download.outputs.has_url != 'true'
        timeout-minutes: 10
        env:
          PG_VERSION: ${{ github.event.inputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          PG_CRON=$(./builds/postgresql/pg-cron.sh applies "$PG_VERSION" "$PLATFORM")
          if [ "$PG_CRON" != "yes" ]; then
            echo "pg_cron is not part of PostgreSQL $PG_VERSION on $PLATFORM; nothing to verify."
            exit 0
          fi
          SOURCE_VERSION="${{ needs.prepare.outputs.source_version }}"
          docker buildx build --platform linux/amd64 --target packager --load \
            --build-arg SOURCE_VERSION="$SOURCE_VERSION" --build-arg FULL_VERSION="$PG_VERSION" \
            -t pg-cron-smoke -f builds/postgresql/Dockerfile .
          FIXTURE_ROOT=$(mktemp -d)
          trap 'rm -rf "$FIXTURE_ROOT"; docker image rm pg-cron-smoke' EXIT
          tar -xzf "dist/postgresql-${PG_VERSION}-linux-x64.tar.gz" -C "$FIXTURE_ROOT"
          chmod -R a+rX "$FIXTURE_ROOT"
          docker run --rm --network none --read-only --user 65534:65534 \
            --memory 1g --cpus 0.5 --tmpfs /tmp:rw,exec,size=256m \
            --mount "type=bind,src=$FIXTURE_ROOT/postgresql,dst=/opt/postgresql,readonly" \
            --mount "type=bind,src=$PWD/builds/postgresql/smoke-pg-cron.sh,dst=/smoke.sh,readonly" \
            pg-cron-smoke bash /smoke.sh

      # PostGIS ships inside the standard build wherever postgis.sh scopes it
      # in. The archive is mounted away from /opt/postgresql with PROJ_DATA
      # unset, so the smoke proves the relocated archive resolves its own
      # libraries and finds share/proj/proj.db relative to lib/libproj.so.
      - name: Verify PostGIS in the archive
        if: matrix.build_type == 'docker' && steps.check-download.outputs.has_url != 'true'
        timeout-minutes: 15
        env:
          PG_VERSION: ${{ github.event.inputs.version }}
          PLATFORM: ${{ matrix.platform }}
          SOURCE_VERSION: ${{ needs.prepare.outputs.source_version }}
        run: |
          POSTGIS=$(./builds/postgresql/postgis.sh applies "$PG_VERSION" "$PLATFORM")
          if [ "$POSTGIS" != "yes" ]; then
            echo "PostGIS is not part of PostgreSQL $PG_VERSION on $PLATFORM; nothing to verify."
            exit 0
          fi
          PINS=$(./builds/postgresql/postgis.sh pins "$PG_VERSION")
          EXPECTED_POSTGIS=$(sed -n 's/^POSTGIS=//p' <<<"$PINS")
          EXPECTED_GEOS=$(sed -n 's/^GEOS=//p' <<<"$PINS")
          EXPECTED_PROJ=$(sed -n 's/^PROJ=//p' <<<"$PINS")
          docker buildx build --platform linux/amd64 --target packager --load \
            --build-arg SOURCE_VERSION="$SOURCE_VERSION" --build-arg FULL_VERSION="$PG_VERSION" \
            -t postgis-smoke -f builds/postgresql/Dockerfile .
          FIXTURE_ROOT=$(mktemp -d)
          trap 'rm -rf "$FIXTURE_ROOT"; docker image rm postgis-smoke' EXIT
          tar -xzf "dist/postgresql-${PG_VERSION}-linux-x64.tar.gz" -C "$FIXTURE_ROOT"
          chmod -R a+rX "$FIXTURE_ROOT"
          ./builds/postgresql/postgis.sh verify "$FIXTURE_ROOT/postgresql"
          echo "PostGIS manifest: $(./builds/postgresql/postgis.sh manifest "$FIXTURE_ROOT/postgresql" | wc -l) paths"
          docker run --rm --network none --read-only --user 65534:65534 \
            --memory 1g --cpus 0.5 --tmpfs /tmp:rw,exec,size=256m \
            -e EXPECTED_POSTGIS="$EXPECTED_POSTGIS" -e EXPECTED_GEOS="$EXPECTED_GEOS" -e EXPECTED_PROJ="$EXPECTED_PROJ" \
            --mount "type=bind,src=$FIXTURE_ROOT/postgresql,dst=/relocated/postgresql,readonly" \
            --mount "type=bind,src=$PWD/builds/postgresql/smoke-postgis.sh,dst=/smoke-postgis.sh,readonly" \
            postgis-smoke bash /smoke-postgis.sh /relocated/postgresql

      # For Windows: download official EDB binary
      - name: Download for Windows (official EDB binary)
        if: matrix.build_type == 'download'
        id: build-windows
        run: |
          VERSION="${{ github.event.inputs.version }}"
          SOURCE_VERSION="${{ needs.prepare.outputs.source_version }}"

          echo "Downloading PostgreSQL $VERSION for win32-x64 from EDB"

          # Read download URL from sources.json (EDB uses non-predictable file IDs)
          URL=$(jq -r ".versions[\"$VERSION\"][\"win32-x64\"].url" builds/postgresql/sources.json)

          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "::error::No download URL found in sources.json for version $VERSION win32-x64"
            exit 1
          fi

          echo "Download URL: $URL"

          mkdir -p dist/downloads dist/temp

          # Download with retry
          for i in 1 2 3; do
            if curl -fsSL "$URL" -o "dist/downloads/postgresql-${SOURCE_VERSION}-win32-x64-original.zip"; then
              echo "Download succeeded"
              break
            fi
            echo "Download attempt $i failed, retrying..."
            sleep $((2**i))
          done

          if [ ! -f "dist/downloads/postgresql-${SOURCE_VERSION}-win32-x64-original.zip" ]; then
            echo "::error::Failed to download Windows binary from EDB"
            exit 1
          fi

          # Extract and repackage
          cd dist/temp
          unzip -q ../downloads/postgresql-${SOURCE_VERSION}-win32-x64-original.zip

          # Verify extracted layout and rename for consistency
          echo "Extracted contents:"
          ls -la

          if [ -d "postgresql" ]; then
            echo "Directory 'postgresql' already exists, using as-is"
          elif [ -d "pgsql" ]; then
            # EDB ZIP extracts to 'pgsql' directory - rename to 'postgresql' for consistency
            mv pgsql postgresql
          else
            echo "::error::Unexpected ZIP layout for PostgreSQL ${SOURCE_VERSION} win32-x64"
            echo "Expected 'pgsql' or 'postgresql' directory but found:"
            ls -la
            echo "Contents of dist/temp:"
            find . -maxdepth 2 -type d
            exit 1
          fi

          # Add metadata (use full VERSION for consistency, e.g., 18.1.0)
          cat > postgresql/.hostdb-metadata.json << EOF
          {
            "name": "postgresql",
            "version": "${VERSION}",
            "platform": "win32-x64",
            "source": "official",
            "sourceUrl": "https://www.enterprisedb.com/",
            "rehosted_by": "hostdb",
            "rehosted_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

          # Create zip with consistent naming (use full VERSION, e.g., 18.1.0)
          zip -rq "../postgresql-${VERSION}-win32-x64.zip" postgresql

          cd ..
          rm -rf temp downloads

          ls -la .

      # For macOS: native build with Homebrew dependencies
      - name: Install macOS build dependencies
        if: matrix.build_type == 'native'
        run: |
          brew install openssl@3 readline libxml2 libxslt icu4c pkg-config

      - name: Build for macOS (native)
        if: matrix.build_type == 'native'
        id: build-macos
        timeout-minutes: 90
        run: |
          # SOURCE_VERSION is 2-part (e.g., 18.1) for downloading PostgreSQL source
          # FULL_VERSION is 3-part (e.g., 18.1.0) for artifact naming
          SOURCE_VERSION="${{ needs.prepare.outputs.source_version }}"
          FULL_VERSION="${{ github.event.inputs.version }}"
          PLATFORM="${{ matrix.platform }}"

          echo "Building PostgreSQL $FULL_VERSION for $PLATFORM (native macOS build)"

          # Get Homebrew prefix (differs between ARM64 and Intel macOS)
          BREW_PREFIX=$(brew --prefix)
          OPENSSL_PREFIX=$(brew --prefix openssl@3)
          ICU_PREFIX=$(brew --prefix icu4c)

          echo "Using OpenSSL at: $OPENSSL_PREFIX"
          echo "Using ICU at: $ICU_PREFIX"

          # Clean up any previous build artifacts
          rm -rf postgresql-source.tar.gz postgresql-${SOURCE_VERSION} install dist

          # Download source (uses 2-part version, e.g., postgresql-18.1.tar.gz)
          curl -fsSL "https://ftp.postgresql.org/pub/source/v${SOURCE_VERSION}/postgresql-${SOURCE_VERSION}.tar.gz" \
            -o postgresql-source.tar.gz
          tar -xzf postgresql-source.tar.gz

          cd postgresql-${SOURCE_VERSION}

          # Fix for Xcode 16+ SDK/toolchain mismatch issues
          # Force latest Xcode as the active developer directory
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Using Xcode: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"

          # Get SDK and toolchain paths
          export SDKROOT=$(xcrun --sdk macosx --show-sdk-path)
          XCODE_TOOLCHAIN=$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain

          echo "Using Xcode SDK (SDKROOT): $SDKROOT"
          echo "Using Xcode Toolchain: $XCODE_TOOLCHAIN"

          # Set compiler environment variables to force correct SDK
          export CC="$XCODE_TOOLCHAIN/usr/bin/clang"
          export CXX="$XCODE_TOOLCHAIN/usr/bin/clang++"
          export CFLAGS="--sysroot=$SDKROOT -I${OPENSSL_PREFIX}/include -I${ICU_PREFIX}/include"
          export CPPFLAGS="$CFLAGS"
          export LDFLAGS="--sysroot=$SDKROOT -L${OPENSSL_PREFIX}/lib -L${ICU_PREFIX}/lib"
          export PKG_CONFIG_PATH="${OPENSSL_PREFIX}/lib/pkgconfig:${ICU_PREFIX}/lib/pkgconfig"

          # Verify clang uses correct SDK
          echo "Clang SDK check:"
          $CC --version
          $CC -v -E -x c /dev/null 2>&1 | grep "selected sysroot" || true

          # Configure PostgreSQL
          ./configure \
            --prefix="$GITHUB_WORKSPACE/install/postgresql" \
            --with-openssl \
            --with-readline \
            --with-libxml \
            --with-libxslt \
            --with-icu \
            --with-uuid=e2fs \
            --without-systemd

          # Build
          make -j$(sysctl -n hw.ncpu)

          # Install
          make install

          # Build and install contrib modules
          cd contrib
          make -j$(sysctl -n hw.ncpu)
          make install
          cd ..

          # Add metadata (use full 3-part version for consistency)
          cd "$GITHUB_WORKSPACE/install"
          cat > postgresql/.hostdb-metadata.json << EOF
          {
            "name": "postgresql",
            "version": "${FULL_VERSION}",
            "platform": "${PLATFORM}",
            "source": "source-build",
            "sourceUrl": "https://ftp.postgresql.org/",
            "rehosted_by": "hostdb",
            "rehosted_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

          # Verify key binaries exist
          test -f postgresql/bin/postgres || { echo "::error::postgres binary not found"; exit 1; }
          test -f postgresql/bin/psql || { echo "::error::psql binary not found"; exit 1; }
          test -f postgresql/lib/pg_stat_statements.so || echo "::warning::pg_stat_statements.so not found"
          test -f postgresql/lib/uuid-ossp.so || { echo "::error::uuid-ossp.so not found"; exit 1; }

          # Make binaries relocatable by fixing hardcoded paths
          # This ensures binaries work regardless of where they're installed
          echo "Making binaries relocatable..."

          # Enable nullglob so unmatched patterns expand to nothing
          shopt -s nullglob

          # Function to get all dylib dependencies, resolving @loader_path relative to file's directory
          get_deps() {
            local file="$1"
            local filedir=$(dirname "$file")
            otool -L "$file" 2>/dev/null | tail -n +2 | awk '{print $1}' | while read -r dep; do
              # Skip system libraries
              [[ "$dep" == /usr/lib/* ]] && continue
              [[ "$dep" == /System/* ]] && continue
              [[ "$dep" == @executable_path/* ]] && continue
              [[ "$dep" == @rpath/* ]] && continue

              # Resolve @loader_path relative to the file's directory
              if [[ "$dep" == @loader_path/* ]]; then
                local resolved="${filedir}/${dep#@loader_path/}"
                [[ -f "$resolved" ]] && echo "$resolved"
              else
                echo "$dep"
              fi
            done
          }

          # Copy required Homebrew dylibs into our lib directory
          echo "Bundling external dependencies..."
          PROCESSED_DEPS=()
          DEPS_TO_PROCESS=()

          # Helper to check if dep was already processed
          is_processed() {
            local check="$1"
            for p in "${PROCESSED_DEPS[@]}"; do
              [[ "$p" == "$check" ]] && return 0
            done
            return 1
          }

          # Collect initial dependencies from all binaries and libraries
          for binary in postgresql/bin/*; do
            if [[ -f "$binary" && -x "$binary" ]]; then
              while IFS= read -r dep; do
                [[ -n "$dep" ]] && DEPS_TO_PROCESS+=("$dep")
              done < <(get_deps "$binary")
            fi
          done

          for lib in postgresql/lib/*.dylib postgresql/lib/*.so; do
            if [[ -f "$lib" ]]; then
              while IFS= read -r dep; do
                [[ -n "$dep" ]] && DEPS_TO_PROCESS+=("$dep")
              done < <(get_deps "$lib")
            fi
          done

          # Process dependencies (including transitive ones)
          while [[ ${#DEPS_TO_PROCESS[@]} -gt 0 ]]; do
            dep="${DEPS_TO_PROCESS[0]}"
            DEPS_TO_PROCESS=("${DEPS_TO_PROCESS[@]:1}")

            # Skip if already processed
            is_processed "$dep" && continue
            PROCESSED_DEPS+=("$dep")

            # Skip if not a file
            [[ ! -f "$dep" ]] && continue

            libname=$(basename "$dep")
            target="postgresql/lib/$libname"

            # Skip if already exists
            [[ -f "$target" ]] && continue

            echo "  Bundling: $libname (from $dep)"
            cp "$dep" "$target"
            chmod 755 "$target"

            # Check for transitive dependencies - scan ORIGINAL file to resolve @loader_path correctly
            while IFS= read -r transitive; do
              [[ -n "$transitive" ]] && DEPS_TO_PROCESS+=("$transitive")
            done < <(get_deps "$dep")
          done

          # Fix the bundled dylibs - set their install names and fix internal references
          echo "Fixing bundled dylib install names..."
          for dylib in postgresql/lib/*.dylib; do
            if [[ -f "$dylib" ]]; then
              libname=$(basename "$dylib")

              # Set the library's own install name to use @rpath
              install_name_tool -id "@rpath/$libname" "$dylib" 2>/dev/null || true

              # Fix references to other libraries (both absolute paths and @loader_path)
              otool -L "$dylib" 2>/dev/null | tail -n +2 | awk '{print $1}' | while read -r dep; do
                [[ "$dep" == /usr/lib/* ]] && continue
                [[ "$dep" == /System/* ]] && continue
                [[ "$dep" == @rpath/* ]] && continue
                [[ "$dep" == @executable_path/* ]] && continue
                depname=$(basename "$dep")
                install_name_tool -change "$dep" "@rpath/$depname" "$dylib" 2>/dev/null || true
              done
            fi
          done

          # Fix binaries to use @executable_path/../lib for bundled libraries
          echo "Fixing binary library paths..."
          for binary in postgresql/bin/*; do
            if [[ -f "$binary" && -x "$binary" ]]; then
              # Add rpath for finding libraries relative to executable
              install_name_tool -add_rpath "@executable_path/../lib" "$binary" 2>/dev/null || true

              # Fix references to external libraries (both absolute paths and @loader_path)
              otool -L "$binary" 2>/dev/null | tail -n +2 | awk '{print $1}' | while read -r dep; do
                [[ "$dep" == /usr/lib/* ]] && continue
                [[ "$dep" == /System/* ]] && continue
                [[ "$dep" == @rpath/* ]] && continue
                [[ "$dep" == @executable_path/* ]] && continue
                depname=$(basename "$dep")
                install_name_tool -change "$dep" "@executable_path/../lib/$depname" "$binary" 2>/dev/null || true
              done
            fi
          done

          # Fix .so files (PostgreSQL extensions) the same way
          echo "Fixing extension library paths..."
          for lib in postgresql/lib/*.so; do
            if [[ -f "$lib" ]]; then
              install_name_tool -add_rpath "@loader_path" "$lib" 2>/dev/null || true

              otool -L "$lib" 2>/dev/null | tail -n +2 | awk '{print $1}' | while read -r dep; do
                [[ "$dep" == /usr/lib/* ]] && continue
                [[ "$dep" == /System/* ]] && continue
                [[ "$dep" == @rpath/* ]] && continue
                [[ "$dep" == @executable_path/* ]] && continue
                depname=$(basename "$dep")
                install_name_tool -change "$dep" "@rpath/$depname" "$lib" 2>/dev/null || true
              done
            fi
          done

          # Re-sign all modified binaries and libraries with ad-hoc signatures
          # install_name_tool invalidates existing code signatures, causing macOS to kill the process
          echo "Re-signing binaries and libraries..."
          for dylib in postgresql/lib/*.dylib; do
            if [[ -f "$dylib" ]]; then
              codesign --force --sign - "$dylib" 2>/dev/null || true
            fi
          done
          for binary in postgresql/bin/*; do
            if [[ -f "$binary" && -x "$binary" ]]; then
              codesign --force --sign - "$binary" 2>/dev/null || true
            fi
          done
          echo "✓ Re-signed all binaries and libraries"

          # Verify no hardcoded paths remain
          echo "Verifying relocatable binaries..."
          FAILED=0
          for binary in postgresql/bin/postgres postgresql/bin/psql postgresql/bin/initdb; do
            if [[ -f "$binary" ]]; then
              REMAINING=$(otool -L "$binary" 2>/dev/null | grep -E '/Users/|/opt/homebrew/' || true)
              if [[ -n "$REMAINING" ]]; then
                echo "::warning::Hardcoded paths remain in $(basename $binary):"
                echo "$REMAINING"
                FAILED=1
              fi
            fi
          done

          if [[ $FAILED -eq 0 ]]; then
            echo "✓ All binaries are relocatable"
          fi

          # Create tarball (use full 3-part version for artifact naming)
          mkdir -p "$GITHUB_WORKSPACE/dist"
          tar -czvf "$GITHUB_WORKSPACE/dist/postgresql-${FULL_VERSION}-${PLATFORM}.tar.gz" postgresql

          echo "Build complete:"
          ls -la "$GITHUB_WORKSPACE/dist/"

      - name: Generate checksum
        run: |
          cd dist
          shopt -s nullglob
          for f in *.tar.gz *.zip; do
            if [ -f "$f" ]; then
              if command -v sha256sum &> /dev/null; then
                sha256sum "$f" >> checksums.txt
              else
                # macOS uses shasum
                shasum -a 256 "$f" >> checksums.txt
              fi
            fi
          done
          cat checksums.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: postgresql-${{ github.event.inputs.version }}-${{ matrix.platform }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          retention-days: 1

  # A dry run (inputs.dry_run) ends here: the same asset checks the release job
  # runs, with nothing published.
  dry-run-checks:
    needs: build
    if: ${{ inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          pattern: postgresql-${{ github.event.inputs.version }}-*

      - name: Collect assets
        run: |
          mkdir -p ./release-assets
          find ./artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec mv {} ./release-assets/ \;
          find ./artifacts -name "checksums.txt" -exec cat {} \; > ./release-assets/checksums.txt
          shopt -s nullglob
          FILES=(./release-assets/*.tar.gz ./release-assets/*.zip)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "ERROR: No artifacts were created for any platform"
            exit 1
          fi
          ls -la ./release-assets/
          cat ./release-assets/checksums.txt

      - name: Validate required binaries
        run: |
          chmod +x builds/common/validate-binaries.sh
          ./builds/common/validate-binaries.sh postgresql ./release-assets

      - name: Check GLIBC floor (Linux artifacts)
        run: |
          chmod +x builds/common/check-glibc-floor.sh
          ./builds/common/check-glibc-floor.sh postgresql ./release-assets

      - name: Check platform coverage
        run: |
          chmod +x builds/common/check-platform-coverage.sh
          ./builds/common/check-platform-coverage.sh postgresql "${{ github.event.inputs.version }}" "${{ github.event.inputs.platforms }}" ./release-assets

      - name: Report (nothing published)
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          echo "Dry run of PostgreSQL $VERSION complete. Nothing was published:"
          echo "no GitHub release, no R2 upload, no releases.json change."
          if [ -f "./release-assets/postgresql-${VERSION}-linux-x64.tar.gz" ]; then
            ROOT=$(mktemp -d)
            tar -xzf "./release-assets/postgresql-${VERSION}-linux-x64.tar.gz" -C "$ROOT"
            if [ "$(./builds/postgresql/postgis.sh applies "$VERSION" linux-x64)" = "yes" ]; then
              echo "PostGIS manifest of the linux-x64 archive:"
              ./builds/postgresql/postgis.sh manifest "$ROOT/postgresql"
              cat "$ROOT/postgresql/SOURCES.txt"
            fi
          fi

  # Mirror the exact PostGIS, GEOS, PROJ (and, for PostGIS 3.7, GMP) source
  # tarballs the build verified to a dedicated `sources-postgis-<version>`
  # GitHub release and to R2, so every archive's SOURCES.txt points at a
  # Corresponding Source that exists before the archive is published. Runs
  # before `release`; a no-op when PostGIS is not in this run's scope. Never
  # runs on a dry run, and never replaces an asset that already exists.
  mirror-postgis-sources:
    needs: [prepare, build]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Decide scope
        id: scope
        env:
          VERSION: ${{ github.event.inputs.version }}
          MATRIX: ${{ needs.prepare.outputs.matrix }}
        run: |
          if ! jq -e 'map(.platform) | index("linux-x64") != null' <<<"$MATRIX" >/dev/null; then
            echo "This run does not build linux-x64; no PostGIS sources to mirror."
            echo "applies=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          APPLIES=$(./builds/postgresql/postgis.sh applies "$VERSION" linux-x64)
          echo "applies=$APPLIES" >> "$GITHUB_OUTPUT"
          if [ "$APPLIES" = "yes" ]; then
            TAG=$(./builds/postgresql/postgis.sh pins "$VERSION" | sed -n 's/^MIRROR_TAG=//p')
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "Mirroring PostGIS sources for PostgreSQL $VERSION to $TAG"
          else
            echo "PostGIS is not part of PostgreSQL $VERSION; nothing to mirror."
          fi

      - name: Fetch and verify the pinned sources
        if: steps.scope.outputs.applies == 'yes'
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          ./builds/postgresql/postgis.sh fetch-sources "$VERSION" dist/sources
          (cd dist/sources && sha256sum -- * > SHA256SUMS)
          cat dist/sources/SHA256SUMS

      - name: Publish the sources release
        if: steps.scope.outputs.applies == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.scope.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG exists; adding only missing assets and checking the rest byte for byte."
            EXISTING=$(gh release view "$TAG" --json assets --jq '.assets[].name')
            for f in dist/sources/*; do
              name=$(basename "$f")
              if grep -qxF "$name" <<<"$EXISTING"; then
                published=$(gh release download "$TAG" --pattern "$name" --output - | sha256sum | cut -d' ' -f1)
                local_sum=$(sha256sum "$f" | cut -d' ' -f1)
                if [ "$published" != "$local_sum" ]; then
                  echo "::error::$TAG already has $name with sha256 $published, but the pinned file is $local_sum. Published sources are immutable; investigate before re-running."
                  exit 1
                fi
              else
                gh release upload "$TAG" "$f"
              fi
            done
          else
            {
              echo "Corresponding Source for the PostGIS build in the hostdb PostgreSQL archives."
              echo
              echo "Byte-identical copies of the upstream files, verified against the sha256 pins in builds/postgresql/postgis.sh. Each archive's SOURCES.txt and licenses/ directory point here. Mirrored at https://registry.layerbase.host/$TAG/<file>."
            } > sources-notes.md
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Sources: $TAG" \
              --notes-file sources-notes.md --latest=false dist/sources/*
          fi
          PUBLISHED=$(gh release view "$TAG" --json assets --jq '.assets[].name' | sort)
          EXPECTED=$(cd dist/sources && ls -1 | sort)
          if [ "$PUBLISHED" != "$EXPECTED" ]; then
            echo "::error::$TAG assets do not match the pinned sources."
            diff <(echo "$EXPECTED") <(echo "$PUBLISHED")
            exit 1
          fi

      - name: Setup pnpm
        if: steps.scope.outputs.applies == 'yes'
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        if: steps.scope.outputs.applies == 'yes'
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.scope.outputs.applies == 'yes'
        run: pnpm install --frozen-lockfile

      # No --force: a source object that already exists on R2 is never
      # overwritten.
      - name: Mirror the sources to R2
        if: steps.scope.outputs.applies == 'yes'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          TAG: ${{ steps.scope.outputs.tag }}
        run: pnpm tsx scripts/upload-to-r2.ts --tag "$TAG"

  # Collect all artifacts and create release
  release:
    needs: [build, mirror-postgis-sources]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          pattern: postgresql-${{ github.event.inputs.version }}-*

      - name: Prepare release assets
        run: |
          mkdir -p ./release-assets

          # Move all artifacts to release-assets, flattening the directory structure
          find ./artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec mv {} ./release-assets/ \;

          # Combine all checksums
          find ./artifacts -name "checksums.txt" -exec cat {} \; > ./release-assets/checksums.txt

          echo "Release assets:"
          ls -la ./release-assets/

          # Verify we have at least one artifact
          shopt -s nullglob
          FILES=(./release-assets/*.tar.gz ./release-assets/*.zip)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "ERROR: No artifacts were created for any platform"
            exit 1
          fi

          echo ""
          echo "Checksums:"
          cat ./release-assets/checksums.txt

      - name: Validate required binaries
        run: |
          chmod +x builds/common/validate-binaries.sh
          ./builds/common/validate-binaries.sh postgresql ./release-assets

      - name: Check GLIBC floor (Linux artifacts)
        run: |
          chmod +x builds/common/check-glibc-floor.sh
          ./builds/common/check-glibc-floor.sh postgresql ./release-assets

      - name: Check platform coverage
        run: |
          chmod +x builds/common/check-platform-coverage.sh
          ./builds/common/check-platform-coverage.sh postgresql "${{ github.event.inputs.version }}" "${{ github.event.inputs.platforms }}" ./release-assets

      # A partial-platform dispatch (platforms != all) only rebuilds the
      # checksums for what it built, and action-gh-release REPLACES the
      # release's checksums.txt rather than merging. releases.json is derived
      # from checksums.txt, so an unmerged partial upload silently drops every
      # platform this run did not touch. Merge the existing lines back in first.
      - name: Merge existing release checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x builds/common/merge-release-checksums.sh
          ./builds/common/merge-release-checksums.sh "postgresql-${{ github.event.inputs.version }}" ./release-assets/checksums.txt

      # action-gh-release uploaded all six assets CONCURRENTLY with no per-file
      # retry and published the release before anything was verified. On the
      # 2026-09-17 MariaDB wave that step failed or stalled on 5 of 8 attempts
      # ("Error saving asset", "Headers Timeout Error", "Error creating asset
      # temp dir", and a 46-minute stall on the 450 MB linux-x64 archive that a
      # hand-run `gh release upload` then finished in 44 seconds). The release
      # is now created as a DRAFT, every asset is uploaded one at a time with
      # retries, checksums.txt goes last, the upload is verified against it, and
      # only then is the release published.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Bound through env: a workflow input is attacker-controlled text,
          # and an expression splices it into the script before bash sees it.
          VERSION: ${{ github.event.inputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p ./release-notes
          cat >./release-notes/body.md <<'RELEASE_NOTES'
          ## PostgreSQL __VERSION__

          PostgreSQL binaries built from source for hostdb.

          ### Available Platforms
          | Platform | Source |
          |----------|--------|
          | `linux-x64` | Built from source (Docker) |
          | `linux-arm64` | Built from source (Docker/QEMU) |
          | `darwin-x64` | Built from source (native macOS) |
          | `darwin-arm64` | Built from source (native macOS) |
          | `win32-x64` | Official EDB binary |

          ### Features
          - All contrib modules included (pg_stat_statements, etc.)
          - Built with SSL, readline, XML, XSLT, and ICU support

          ### Usage
          ```bash
          # Download URL pattern
          https://github.com/__REPOSITORY__/releases/download/postgresql-__VERSION__/postgresql-__VERSION__-<platform>.tar.gz
          ```

          ### Checksums
          See `checksums.txt` for SHA256 checksums.

          ### Sources
          - **Source Builds**: [ftp.postgresql.org](https://ftp.postgresql.org/pub/source/)
          - **Windows Binary**: [EnterpriseDB](https://www.enterprisedb.com/)
          RELEASE_NOTES

          # The notes are written with placeholders so the heredoc carries no
          # expression at all; fill them in from the env bindings above.
          python3 - <<'FILL_PLACEHOLDERS'
          import os

          path = './release-notes/body.md'
          with open(path, encoding='utf-8') as handle:
              body = handle.read()
          body = body.replace('__VERSION__', os.environ['VERSION'])
          body = body.replace('__REPOSITORY__', os.environ['REPOSITORY'])
          with open(path, 'w', encoding='utf-8') as handle:
              handle.write(body)
          FILL_PLACEHOLDERS

          chmod +x builds/common/publish-release.sh
          ./builds/common/publish-release.sh \
            --target "${{ github.sha }}" \
            --tag "postgresql-$VERSION" \
            --title "PostgreSQL $VERSION" \
            --notes-file ./release-notes/body.md \
            --assets-dir ./release-assets \
            --prerelease "${{ contains(github.event.inputs.version, '-alpha.') || contains(github.event.inputs.version, '-beta.') || contains(github.event.inputs.version, '-rc.') }}"

  # Update the releases manifest
  upload-to-r2:
    needs: release
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Upload to R2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: pnpm tsx scripts/upload-to-r2.ts --tag "postgresql-${{ github.event.inputs.version }}" --force

  update-releases:
    needs: upload-to-r2
    if: ${{ !inputs.dry_run }}
    # releases.json is one shared file committed to main and pushed to R2, and
    # each run rebuilds the WHOLE manifest, so two of these at once is
    # last-writer-wins: the loser's version silently disappears from the
    # manifest. Serialize repo-wide across every engine.
    #
    # Trade-off: GitHub keeps only one PENDING entry per group, so a third
    # simultaneous manifest job would be evicted. That is the strictly better
    # failure: an evicted job leaves a version missing from releases.json, which
    # publish.yml's drift gate catches before anything ships and one
    # rebuild-releases.yml dispatch repairs, whereas the race it prevents
    # silently reverts an already-published version with nothing to catch it.
    concurrency:
      group: hostdb-releases-manifest
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      - name: Rebuild releases.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: pnpm tsx scripts/build-releases-json.ts --upload-r2

      - name: Commit and push
        env:
          MANIFEST_BRANCH: main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add releases.json databases.json
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "chore: update releases.json"
          git fetch origin "+refs/heads/$MANIFEST_BRANCH:refs/remotes/origin/$MANIFEST_BRANCH"
          git merge --no-edit "origin/$MANIFEST_BRANCH"
          git push origin "HEAD:$MANIFEST_BRANCH"
