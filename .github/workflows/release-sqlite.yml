name: Release SQLite

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'SQLite version'
        required: true
        type: choice
        options:
          - 3.53.4
          - 3.53.1
          - 3.51.2
        default: 3.53.4
      platforms:
        description: 'Platforms'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'linux-x64'
          - 'linux-arm64'
          - 'darwin-x64'
          - 'darwin-arm64'
          - 'win32-x64'

# Prevent concurrent runs that could conflict when updating releases.json
concurrency:
  group: release-sqlite-${{ github.event.inputs.version }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate version against databases.json
        run: |
          DB="sqlite"

          echo "Validating SQLite version: $VERSION"

          # A version is enabled if its value is `true` or an object without `"enabled": false`
          ENABLED=$(jq -r "
            .databases.$DB.versions[\"$VERSION\"] // null
            | if . == null or . == false then \"false\"
              elif type == \"object\" and .enabled == false then \"false\"
              else \"true\"
            end
          " databases.json)
          if [ "$ENABLED" != "true" ]; then
            echo "::error::Version '$VERSION' is not enabled in databases.json"
            echo ""
            echo "Available versions:"
            jq -r "
              .databases.$DB.versions | to_entries
              | map(select(.value == true or ((.value | type) == \"object\" and (.value.enabled // true) == true)))
              | .[].key
            " databases.json
            exit 1
          fi

          echo "✓ Version $VERSION is enabled in databases.json"

      - name: Validate sources.json exists
        run: |
          DB="sqlite"
          if [ ! -f "builds/$DB/sources.json" ]; then
            echo "::error::Missing builds/$DB/sources.json"
            exit 1
          fi
          echo "✓ builds/$DB/sources.json exists"

      - name: Validate version in sources.json
        run: |
          DB="sqlite"

          HAS_VERSION=$(jq -r ".versions[\"$VERSION\"] // empty" "builds/$DB/sources.json")
          if [ -z "$HAS_VERSION" ]; then
            echo "::error::Version '$VERSION' not found in builds/$DB/sources.json"
            echo ""
            echo "Available versions in sources.json:"
            jq -r ".versions | keys[]" "builds/$DB/sources.json"
            exit 1
          fi

          echo "✓ Version $VERSION found in sources.json"

  # Build Linux binaries from source for GLIBC 2.31 compatibility
  # Official SQLite binaries require GLIBC 2.38+ which breaks Ubuntu 22.04
  build-linux:
    needs: validate
    if: github.event.inputs.platforms == 'all' || github.event.inputs.platforms == 'linux-x64' || github.event.inputs.platforms == 'linux-arm64'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            docker_platform: linux/amd64
          - platform: linux-arm64
            docker_platform: linux/arm64
    env:
      VERSION: ${{ github.event.inputs.version }}
    steps:
      - name: Check if platform should be built
        id: check
        run: |
          PLATFORMS="${{ github.event.inputs.platforms }}"
          PLATFORM="${{ matrix.platform }}"
          if [ "$PLATFORMS" = "all" ] || [ "$PLATFORMS" = "$PLATFORM" ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
          else
            echo "should_build=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout
        if: steps.check.outputs.should_build == 'true'
        uses: actions/checkout@v6

      - name: Set up QEMU
        if: steps.check.outputs.should_build == 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: steps.check.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build SQLite for ${{ matrix.platform }}
        if: steps.check.outputs.should_build == 'true'
        run: |
          mkdir -p dist

          # Build Docker image for target platform
          docker buildx build \
            --platform ${{ matrix.docker_platform }} \
            --build-arg VERSION="$VERSION" \
            --load \
            -t sqlite-builder:$VERSION-${{ matrix.platform }} \
            builds/sqlite/

          # Extract artifact
          docker run --rm \
            --platform ${{ matrix.docker_platform }} \
            -v "$(pwd)/dist:/dist" \
            sqlite-builder:$VERSION-${{ matrix.platform }}

          ls -la dist/

      - name: Upload ${{ matrix.platform }} artifact
        if: steps.check.outputs.should_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sqlite-${{ matrix.platform }}-${{ github.event.inputs.version }}
          path: dist/*.tar.gz
          retention-days: 1

  # Download official binaries for non-Linux platforms (macOS, Windows)
  # Linux binaries are built from source for GLIBC compatibility
  build-download:
    needs: validate
    if: github.event.inputs.platforms == 'all' || github.event.inputs.platforms == 'darwin-x64' || github.event.inputs.platforms == 'darwin-arm64' || github.event.inputs.platforms == 'win32-x64'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.inputs.version }}
      PLATFORMS: ${{ github.event.inputs.platforms }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download and repackage SQLite
        run: |
          # Download for non-Linux platforms only (Linux is built from source)
          if [ "$PLATFORMS" = "all" ]; then
            for platform in darwin-x64 darwin-arm64 win32-x64; do
              pnpm download:sqlite -- --version "$VERSION" --platform "$platform" --output ./dist
            done
          else
            pnpm download:sqlite -- --version "$VERSION" --platform "$PLATFORMS" --output ./dist
          fi

          ls -la ./dist/

      - name: Upload download artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sqlite-downloads-${{ github.event.inputs.version }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          retention-days: 1

  release:
    needs: [build-linux, build-download]
    if: always() && (needs.build-linux.result == 'success' || needs.build-linux.result == 'skipped') && (needs.build-download.result == 'success' || needs.build-download.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download linux-x64 artifacts
        if: needs.build-linux.result == 'success' && (github.event.inputs.platforms == 'all' || github.event.inputs.platforms == 'linux-x64')
        uses: actions/download-artifact@v4
        with:
          name: sqlite-linux-x64-${{ github.event.inputs.version }}
          path: ./release-assets

      - name: Download linux-arm64 artifacts
        if: needs.build-linux.result == 'success' && (github.event.inputs.platforms == 'all' || github.event.inputs.platforms == 'linux-arm64')
        uses: actions/download-artifact@v4
        with:
          name: sqlite-linux-arm64-${{ github.event.inputs.version }}
          path: ./release-assets

      - name: Download non-Linux artifacts
        if: needs.build-download.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: sqlite-downloads-${{ github.event.inputs.version }}
          path: ./release-assets

      - name: Generate checksums
        run: |
          cd release-assets
          shopt -s nullglob
          files=(*.tar.gz *.zip)
          if [ ${#files[@]} -gt 0 ]; then
            sha256sum "${files[@]}" > checksums.txt
            echo "Generated checksums for ${#files[@]} file(s):"
            cat checksums.txt
          else
            echo "No .tar.gz or .zip files found - skipping checksum generation"
          fi

      - name: List release assets
        run: ls -la ./release-assets/

      - name: Validate required binaries
        run: |
          chmod +x builds/common/validate-binaries.sh
          ./builds/common/validate-binaries.sh sqlite ./release-assets

      - name: Check GLIBC floor (Linux artifacts)
        run: |
          chmod +x builds/common/check-glibc-floor.sh
          ./builds/common/check-glibc-floor.sh sqlite ./release-assets

      - name: Check platform coverage
        run: |
          chmod +x builds/common/check-platform-coverage.sh
          ./builds/common/check-platform-coverage.sh sqlite "${{ github.event.inputs.version }}" "${{ github.event.inputs.platforms }}" ./release-assets

      # A partial-platform dispatch (platforms != all) only rebuilds the
      # checksums for what it built, and action-gh-release REPLACES the
      # release's checksums.txt rather than merging. releases.json is derived
      # from checksums.txt, so an unmerged partial upload silently drops every
      # platform this run did not touch. Merge the existing lines back in first.
      - name: Merge existing release checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x builds/common/merge-release-checksums.sh
          ./builds/common/merge-release-checksums.sh "sqlite-${{ github.event.inputs.version }}" ./release-assets/checksums.txt

      # action-gh-release uploaded all six assets CONCURRENTLY with no per-file
      # retry and published the release before anything was verified. On the
      # 2026-09-17 MariaDB wave that step failed or stalled on 5 of 8 attempts
      # ("Error saving asset", "Headers Timeout Error", "Error creating asset
      # temp dir", and a 46-minute stall on the 450 MB linux-x64 archive that a
      # hand-run `gh release upload` then finished in 44 seconds). The release
      # is now created as a DRAFT, every asset is uploaded one at a time with
      # retries, checksums.txt goes last, the upload is verified against it, and
      # only then is the release published.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Bound through env: a workflow input is attacker-controlled text,
          # and an expression splices it into the script before bash sees it.
          VERSION: ${{ github.event.inputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p ./release-notes
          cat >./release-notes/body.md <<'RELEASE_NOTES'
          ## SQLite __VERSION__

          SQLite command-line tools repackaged for hostdb.

          SQLite is a self-contained, serverless, zero-configuration SQL database engine.

          ### License

          SQLite is in the **public domain**. No restrictions on use, modification, or distribution.

          ### Included Tools

          - `sqlite3` - Interactive command-line shell
          - `sqldiff` - Database diff utility
          - `sqlite3_analyzer` - Storage analyzer
          - `sqlite3_rsync` - Remote database sync

          ### Platforms
          - `linux-x64` - Linux x86_64 (source build, GLIBC 2.31+)
          - `linux-arm64` - Linux ARM64 (source build, GLIBC 2.31+)
          - `darwin-x64` - macOS Intel (official binary)
          - `darwin-arm64` - macOS Apple Silicon (official binary)
          - `win32-x64` - Windows x64 (official binary)

          ### Usage
          ```bash
          # Download URL pattern
          https://github.com/__REPOSITORY__/releases/download/sqlite-__VERSION__/sqlite-__VERSION__-<platform>.tar.gz
          ```

          ### Checksums
          See `checksums.txt` for SHA256 checksums.

          ### Source
          Official binaries from [sqlite.org](https://sqlite.org/download.html) for macOS and Windows.
          Linux binaries built from source on Ubuntu 20.04 for GLIBC 2.31 compatibility (works on Ubuntu 20.04+).
          RELEASE_NOTES

          # The notes are written with placeholders so the heredoc carries no
          # expression at all; fill them in from the env bindings above.
          python3 - <<'FILL_PLACEHOLDERS'
          import os

          path = './release-notes/body.md'
          with open(path, encoding='utf-8') as handle:
              body = handle.read()
          body = body.replace('__VERSION__', os.environ['VERSION'])
          body = body.replace('__REPOSITORY__', os.environ['REPOSITORY'])
          with open(path, 'w', encoding='utf-8') as handle:
              handle.write(body)
          FILL_PLACEHOLDERS

          chmod +x builds/common/publish-release.sh
          ./builds/common/publish-release.sh \
            --tag "sqlite-$VERSION" \
            --title "SQLite $VERSION" \
            --notes-file ./release-notes/body.md \
            --assets-dir ./release-assets

  upload-to-r2:
    # A single-platform dispatch skips one build job, so the default success()
    # gate would see a skipped ancestor and skip this job, stranding the release.
    needs: release
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Upload to R2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: pnpm tsx scripts/upload-to-r2.ts --tag "sqlite-${{ github.event.inputs.version }}" --force

  update-releases:
    # Same skipped-ancestor rule as upload-to-r2: gate explicitly or a
    # single-platform dispatch never rebuilds releases.json.
    needs: upload-to-r2
    if: always() && needs.upload-to-r2.result == 'success'
    # releases.json is one shared file committed to main and pushed to R2, and
    # each run rebuilds the WHOLE manifest, so two of these at once is
    # last-writer-wins: the loser's version silently disappears from the
    # manifest. Serialize repo-wide across every engine.
    #
    # Trade-off: GitHub keeps only one PENDING entry per group, so a third
    # simultaneous manifest job would be evicted. That is the strictly better
    # failure: an evicted job leaves a version missing from releases.json, which
    # publish.yml's drift gate catches before anything ships and one
    # rebuild-releases.yml dispatch repairs, whereas the race it prevents
    # silently reverts an already-published version with nothing to catch it.
    concurrency:
      group: hostdb-releases-manifest
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      - name: Rebuild releases.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: pnpm tsx scripts/build-releases-json.ts --upload-r2

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add releases.json databases.json
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "chore: update releases.json"
          git pull --rebase origin main
          git push
