name: Release InfluxDB

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'InfluxDB version'
        required: true
        type: choice
        options:
          - 3.10.5
          - 3.8.0
        default: 3.10.5
      platforms:
        description: 'Platforms'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'linux-x64'
          - 'linux-arm64'
          - 'darwin-x64'
          - 'darwin-arm64'
          - 'win32-x64'

# Prevent concurrent runs that could conflict when updating releases.json
concurrency:
  group: release-influxdb-${{ github.event.inputs.version }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate version against databases.json
        run: |
          DB="influxdb"

          echo "Validating InfluxDB version: $VERSION"

          # A version is enabled if its value is `true` or an object without `"enabled": false`
          ENABLED=$(jq -r "
            .databases.$DB.versions[\"$VERSION\"] // null
            | if . == null or . == false then \"false\"
              elif type == \"object\" and .enabled == false then \"false\"
              else \"true\"
            end
          " databases.json)
          if [ "$ENABLED" != "true" ]; then
            echo "::error::Version '$VERSION' is not enabled in databases.json"
            echo ""
            echo "Available versions:"
            jq -r "
              .databases.$DB.versions | to_entries
              | map(select(.value == true or ((.value | type) == \"object\" and (.value.enabled // true) == true)))
              | .[].key
            " databases.json
            exit 1
          fi

          echo "✓ Version $VERSION is enabled in databases.json"

      - name: Validate sources.json exists
        run: |
          DB="influxdb"
          if [ ! -f "builds/$DB/sources.json" ]; then
            echo "::error::Missing builds/$DB/sources.json"
            exit 1
          fi
          echo "✓ builds/$DB/sources.json exists"

      - name: Validate version in sources.json
        run: |
          DB="influxdb"

          HAS_VERSION=$(jq -r ".versions[\"$VERSION\"] // empty" "builds/$DB/sources.json")
          if [ -z "$HAS_VERSION" ]; then
            echo "::error::Version '$VERSION' not found in builds/$DB/sources.json"
            echo ""
            echo "Available versions in sources.json:"
            jq -r ".versions | keys[]" "builds/$DB/sources.json"
            exit 1
          fi

          echo "✓ Version $VERSION found in sources.json"

  # Download official binaries for linux-x64, linux-arm64, darwin-arm64, win32-x64
  build-download:
    needs: validate
    if: github.event.inputs.platforms == 'all' || github.event.inputs.platforms == 'linux-x64' || github.event.inputs.platforms == 'linux-arm64' || github.event.inputs.platforms == 'darwin-arm64' || github.event.inputs.platforms == 'win32-x64'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.inputs.version }}
      PLATFORMS: ${{ github.event.inputs.platforms }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download and repackage InfluxDB
        run: |
          if [ "$PLATFORMS" = "all" ]; then
            # Download all platforms except darwin-x64 (build-required)
            for platform in linux-x64 linux-arm64 darwin-arm64 win32-x64; do
              pnpm download:influxdb -- --version "$VERSION" --platform "$platform" --output ./dist
            done
          else
            # Skip darwin-x64 in download job (handled by build-source)
            if [ "$PLATFORMS" != "darwin-x64" ]; then
              pnpm download:influxdb -- --version "$VERSION" --platform "$PLATFORMS" --output ./dist
            fi
          fi

          ls -la ./dist/ 2>/dev/null || echo "No artifacts (platform may be darwin-x64)"

      - name: Upload download artifacts
        uses: actions/upload-artifact@v4
        with:
          name: influxdb-downloads-${{ github.event.inputs.version }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          retention-days: 1
          if-no-files-found: warn

  # Build from source for darwin-x64 (macOS Intel) - no official binary
  build-source:
    needs: validate
    if: github.event.inputs.platforms == 'all' || github.event.inputs.platforms == 'darwin-x64'
    runs-on: macos-15-intel
    timeout-minutes: 120
    env:
      VERSION: ${{ github.event.inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build InfluxDB for darwin-x64
        run: |
          chmod +x builds/influxdb/build-macos.sh
          ./builds/influxdb/build-macos.sh --version "$VERSION" --output "$GITHUB_WORKSPACE/dist"

          ls -la "$GITHUB_WORKSPACE/dist/"

      - name: Upload darwin-x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: influxdb-darwin-x64-${{ github.event.inputs.version }}
          path: ${{ github.workspace }}/dist/*.tar.gz
          retention-days: 1

  release:
    needs: [build-download, build-source]
    if: always() && (needs.build-download.result == 'success' || needs.build-download.result == 'skipped') && (needs.build-source.result == 'success' || needs.build-source.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download official binary artifacts
        if: needs.build-download.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: influxdb-downloads-${{ github.event.inputs.version }}
          path: ./release-assets

      - name: Download darwin-x64 source build artifacts
        if: needs.build-source.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: influxdb-darwin-x64-${{ github.event.inputs.version }}
          path: ./release-assets

      - name: Generate checksums
        run: |
          cd release-assets
          shopt -s nullglob
          files=(*.tar.gz *.zip)
          if [ ${#files[@]} -gt 0 ]; then
            sha256sum "${files[@]}" > checksums.txt
            echo "Generated checksums for ${#files[@]} file(s):"
            cat checksums.txt
          else
            echo "No .tar.gz or .zip files found - skipping checksum generation"
          fi

      - name: List release assets
        run: ls -la ./release-assets/

      - name: Validate required binaries
        run: |
          chmod +x builds/common/validate-binaries.sh
          ./builds/common/validate-binaries.sh influxdb ./release-assets

      - name: Check GLIBC floor (Linux artifacts)
        run: |
          chmod +x builds/common/check-glibc-floor.sh
          ./builds/common/check-glibc-floor.sh influxdb ./release-assets

      - name: Check platform coverage
        run: |
          chmod +x builds/common/check-platform-coverage.sh
          ./builds/common/check-platform-coverage.sh influxdb "${{ github.event.inputs.version }}" "${{ github.event.inputs.platforms }}" ./release-assets

      # A partial-platform dispatch (platforms != all) only rebuilds the
      # checksums for what it built, and action-gh-release REPLACES the
      # release's checksums.txt rather than merging. releases.json is derived
      # from checksums.txt, so an unmerged partial upload silently drops every
      # platform this run did not touch. Merge the existing lines back in first.
      - name: Merge existing release checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x builds/common/merge-release-checksums.sh
          ./builds/common/merge-release-checksums.sh "influxdb-${{ github.event.inputs.version }}" ./release-assets/checksums.txt

      # action-gh-release uploaded all six assets CONCURRENTLY with no per-file
      # retry and published the release before anything was verified. On the
      # 2026-09-17 MariaDB wave that step failed or stalled on 5 of 8 attempts
      # ("Error saving asset", "Headers Timeout Error", "Error creating asset
      # temp dir", and a 46-minute stall on the 450 MB linux-x64 archive that a
      # hand-run `gh release upload` then finished in 44 seconds). The release
      # is now created as a DRAFT, every asset is uploaded one at a time with
      # retries, checksums.txt goes last, the upload is verified against it, and
      # only then is the release published.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Bound through env: a workflow input is attacker-controlled text,
          # and an expression splices it into the script before bash sees it.
          VERSION: ${{ github.event.inputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p ./release-notes
          cat >./release-notes/body.md <<'RELEASE_NOTES'
          ## InfluxDB __VERSION__

          InfluxDB 3 binaries repackaged for hostdb. Each archive contains the influxdb3 binary, license files, and bundled Python runtime for the plugin system.

          InfluxDB 3 is a purpose-built time-series database rewritten in Rust, using Apache Arrow/DataFusion.

          ### License

          Dual-licensed: **Apache-2.0** AND **MIT**

          ### Platforms
          - `linux-x64` - Linux x86_64 (official binary)
          - `linux-arm64` - Linux ARM64 (official binary)
          - `darwin-x64` - macOS Intel (source build)
          - `darwin-arm64` - macOS Apple Silicon (official binary)
          - `win32-x64` - Windows x64 (official binary)

          ### Archive Contents
          ```
          influxdb/
            .hostdb-metadata.json
            influxdb3
            LICENSE-APACHE
            LICENSE-MIT
            python/           (bundled Python runtime)
          ```

          ### Usage
          ```bash
          # Download URL pattern
          https://github.com/__REPOSITORY__/releases/download/influxdb-__VERSION__/influxdb-__VERSION__-<platform>.tar.gz
          ```

          ### Checksums
          See `checksums.txt` for SHA256 checksums.

          ### Source
          Official binaries from [dl.influxdata.com](https://dl.influxdata.com/influxdb/releases/) for Linux, macOS ARM64, and Windows.
          macOS Intel (darwin-x64) built from source.
          RELEASE_NOTES

          # The notes are written with placeholders so the heredoc carries no
          # expression at all; fill them in from the env bindings above.
          python3 - <<'FILL_PLACEHOLDERS'
          import os

          path = './release-notes/body.md'
          with open(path, encoding='utf-8') as handle:
              body = handle.read()
          body = body.replace('__VERSION__', os.environ['VERSION'])
          body = body.replace('__REPOSITORY__', os.environ['REPOSITORY'])
          with open(path, 'w', encoding='utf-8') as handle:
              handle.write(body)
          FILL_PLACEHOLDERS

          chmod +x builds/common/publish-release.sh
          ./builds/common/publish-release.sh \
            --tag "influxdb-$VERSION" \
            --title "InfluxDB $VERSION" \
            --notes-file ./release-notes/body.md \
            --assets-dir ./release-assets

  upload-to-r2:
    # A single-platform dispatch skips one build job, so the default success()
    # gate would see a skipped ancestor and skip this job, stranding the release.
    needs: release
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Upload to R2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: pnpm tsx scripts/upload-to-r2.ts --tag "influxdb-${{ github.event.inputs.version }}" --force

  update-releases:
    # Same skipped-ancestor rule as upload-to-r2: gate explicitly or a
    # single-platform dispatch never rebuilds releases.json.
    needs: upload-to-r2
    if: always() && needs.upload-to-r2.result == 'success'
    # releases.json is one shared file committed to main and pushed to R2, and
    # each run rebuilds the WHOLE manifest, so two of these at once is
    # last-writer-wins: the loser's version silently disappears from the
    # manifest. Serialize repo-wide across every engine.
    #
    # Trade-off: GitHub keeps only one PENDING entry per group, so a third
    # simultaneous manifest job would be evicted. That is the strictly better
    # failure: an evicted job leaves a version missing from releases.json, which
    # publish.yml's drift gate catches before anything ships and one
    # rebuild-releases.yml dispatch repairs, whereas the race it prevents
    # silently reverts an already-published version with nothing to catch it.
    concurrency:
      group: hostdb-releases-manifest
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      - name: Rebuild releases.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: pnpm tsx scripts/build-releases-json.ts --upload-r2

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add releases.json databases.json
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "chore: update releases.json"
          git pull --rebase origin main
          git push
