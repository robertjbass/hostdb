name: Publish to npm

on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Check if version needs publishing
        id: check
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          NPM=$(npm view hostdb version 2>/dev/null || echo "0.0.0")
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          echo "npm=$NPM" >> $GITHUB_OUTPUT

          NEWER=$(node -e "
            const c = '$CURRENT'.split('.').map(Number);
            const n = '$NPM'.split('.').map(Number);
            for (let i = 0; i < 3; i++) {
              if (c[i] > n[i]) { console.log('true'); process.exit(0); }
              if (c[i] < n[i]) { console.log('false'); process.exit(0); }
            }
            console.log('false');
          ")

          if [ "$NEWER" = "true" ]; then
            echo "Publishing $NPM -> $CURRENT"
            echo "publish=true" >> $GITHUB_OUTPUT
          else
            echo "Version $CURRENT is not newer than npm version $NPM, skipping publish"
            echo "publish=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup pnpm
        if: steps.check.outputs.publish == 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        if: steps.check.outputs.publish == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        if: steps.check.outputs.publish == 'true'
        run: npm install -g npm@latest && pnpm install --frozen-lockfile

      - name: Publish
        if: steps.check.outputs.publish == 'true'
        run: npm publish
        env:
          NPM_CONFIG_PROVENANCE: true
