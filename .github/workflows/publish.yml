name: Publish to npm

on:
  push:
    branches: [main]
  # Manual re-fire. A push event that GitHub swallows (or a run cancelled mid
  # flight) used to leave the only recovery as an empty commit to main. The
  # version guard below publishes only when package.json is newer than npm, so
  # dispatching this by hand is a no-op when there is nothing to publish.
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Check if version needs publishing
        id: check
        env:
          SEMVER_LIB: ${{ runner.temp }}/semver-lib/node_modules/semver
        run: |
          npm install --prefix "$RUNNER_TEMP/semver-lib" --no-save --no-package-lock --ignore-scripts --silent semver@7.6.3
          NPM_VERSION=$(npm view hostdb version 2>/dev/null || echo "0.0.0") node -e '
            const semver = require(process.env.SEMVER_LIB)
            const fs = require("fs")
            const current = JSON.parse(fs.readFileSync("package.json", "utf8")).version
            if (typeof current !== "string" || /[\r\n]/.test(current) || semver.valid(current) !== current) {
              console.error("::error::package.json version must be a single-line semver version")
              process.exit(1)
            }
            if (semver.prerelease(current)) {
              console.error("::error::package.json version must be a release version: prereleases are not published")
              process.exit(1)
            }
            const rawNpm = (process.env.NPM_VERSION || "").trim()
            const npm = semver.valid(rawNpm) === rawNpm ? rawNpm : "0.0.0"
            const publish = semver.gt(current, npm)
            console.log(publish
              ? `Publishing ${npm} -> ${current}`
              : `Version ${current} is not newer than npm version ${npm}, skipping publish`)
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `current=${current}\nnpm=${npm}\npublish=${publish}\n`)
          '

      - name: Setup pnpm
        if: steps.check.outputs.publish == 'true'
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        if: steps.check.outputs.publish == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      # npm trusted publishing requires npm CLI >= 11.5.1 for the current OIDC
      # handshake; otherwise the registry treats the request as anonymous and
      # returns a misleading 404. Node 24 ships with npm 11.x by default;
      # this step is belt-and-suspenders to ensure latest npm regardless.
      # Kept as a SEPARATE step (not combined with the install below) so
      # shell-state corruption from the self-upgrade can't break the install.
      - name: Upgrade npm for OIDC support
        if: steps.check.outputs.publish == 'true'
        run: npm install -g npm@latest

      - name: Install dependencies
        if: steps.check.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile

      # Pre-publish guards. If any of these fail, the publish below is skipped.
      # Tests run against bundled databases.json/releases.json — if the registry
      # snapshot in this commit has drifted from spindb's MAPs, the
      # defaults-sync test fails here and we never publish broken data.
      - name: Regenerate releases.json from GitHub Releases
        if: steps.check.outputs.publish == 'true'
        run: pnpm build:releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail if releases.json drifted (must be committed before publish)
        if: steps.check.outputs.publish == 'true'
        run: |
          if ! git diff --exit-code releases.json; then
            echo "releases.json drifted from what's in this commit."
            echo "Run 'pnpm build:releases' locally, commit the result, then merge to main."
            exit 1
          fi

      - name: Build TypeScript (dist/)
        if: steps.check.outputs.publish == 'true'
        run: pnpm build

      - name: Run resolver + defaults-sync + api-shape tests
        if: steps.check.outputs.publish == 'true'
        run: pnpm test

      - name: Publish
        if: steps.check.outputs.publish == 'true'
        run: npm publish
        env:
          NPM_CONFIG_PROVENANCE: true
