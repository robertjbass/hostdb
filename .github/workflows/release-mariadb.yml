name: Qualify MariaDB instance identity
on: workflow_dispatch
permissions:
  contents: read
  actions: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
          - os: windows-latest
            platform: win32-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: robertjbass/spindb
          ref: 3b6606add344594b8bbed272f384c04470b23f71
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 46177620338
          name: mariadb-11.8.10-${{ matrix.platform }}
          path: artifacts/11.8.10
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 46177622785
          name: mariadb-12.3.4-${{ matrix.platform }}
          path: artifacts/12.3.4
      - name: Verify packages and run lifecycle checks
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          for version in 11.8.10 12.3.4; do
            (cd "artifacts/$version" && sha256sum -c checksums.txt)
            export SPINDB_HOME="$RUNNER_TEMP/maria-$version/.spindb"
            export SPINDB_TEST_MARIADB_VERSION="$version"
            dest="$SPINDB_HOME/bin/mariadb-$version-$PLATFORM"
            mkdir -p "$dest"
            if [[ "$RUNNER_OS" == Windows ]]; then
              tar -xf "artifacts/$version/mariadb-$version-$PLATFORM.zip" -C "$dest" --strip-components=1
            else
              tar -xzf "artifacts/$version/mariadb-$version-$PLATFORM.tar.gz" -C "$dest" --strip-components=1
            fi
            pnpm test:engine mariadb
          done
