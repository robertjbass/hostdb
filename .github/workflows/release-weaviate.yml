name: Release Weaviate

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Weaviate version'
        required: true
        type: choice
        options:
          - 1.38.8
          - 1.35.7
        default: 1.38.8
      platforms:
        description: 'Platforms'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'linux-x64'
          - 'linux-arm64'
          - 'darwin-x64'
          - 'darwin-arm64'
          - 'win32-x64'

# Prevent concurrent runs that could conflict when updating releases.json
concurrency:
  group: release-weaviate-${{ github.event.inputs.version }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate version against databases.json
        run: |
          DB="weaviate"

          echo "Validating Weaviate version: $VERSION"

          # A version is enabled if its value is `true` or an object without `"enabled": false`
          ENABLED=$(jq -r "
            .databases.$DB.versions[\"$VERSION\"] // null
            | if . == null or . == false then \"false\"
              elif type == \"object\" and .enabled == false then \"false\"
              else \"true\"
            end
          " databases.json)
          if [ "$ENABLED" != "true" ]; then
            echo "::error::Version '$VERSION' is not enabled in databases.json"
            echo ""
            echo "Available versions:"
            jq -r "
              .databases.$DB.versions | to_entries
              | map(select(.value == true or ((.value | type) == \"object\" and (.value.enabled // true) == true)))
              | .[].key
            " databases.json
            exit 1
          fi

          echo "✓ Version $VERSION is enabled in databases.json"

      - name: Validate sources.json exists
        run: |
          DB="weaviate"
          if [ ! -f "builds/$DB/sources.json" ]; then
            echo "::error::Missing builds/$DB/sources.json"
            exit 1
          fi
          echo "✓ builds/$DB/sources.json exists"

      - name: Validate version in sources.json
        run: |
          DB="weaviate"

          HAS_VERSION=$(jq -r ".versions[\"$VERSION\"] // empty" "builds/$DB/sources.json")
          if [ -z "$HAS_VERSION" ]; then
            echo "::error::Version '$VERSION' not found in builds/$DB/sources.json"
            echo ""
            echo "Available versions in sources.json:"
            jq -r ".versions | keys[]" "builds/$DB/sources.json"
            exit 1
          fi

          echo "✓ Version $VERSION found in sources.json"

  build:
    needs: validate
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.inputs.version }}
      PLATFORMS: ${{ github.event.inputs.platforms }}
    outputs:
      artifact_names: ${{ steps.build.outputs.artifact_names }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          # Must be >= the go directive in Weaviate's go.mod (1.26 as of 1.38.8).
          # The cross-compile step runs with GOTOOLCHAIN=local, so an older Go here
          # does not auto-upgrade: it fails the darwin/win32 builds with
          # "go.mod requires go >= 1.26" while the workflow still reports success.
          go-version: '1.26'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download and repackage Weaviate
        id: build
        run: |
          if [ "$PLATFORMS" = "all" ]; then
            pnpm download:weaviate -- --version "$VERSION" --all-platforms --output ./dist
          else
            for platform in $(echo "$PLATFORMS" | tr ',' ' '); do
              pnpm download:weaviate -- --version "$VERSION" --platform "$platform" --output ./dist
            done
          fi

          # List created artifacts
          ls -la ./dist/

          # Create artifact names output
          shopt -s nullglob
          FILES=(./dist/*.tar.gz ./dist/*.zip)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "ERROR: No artifacts were created"
            exit 1
          fi
          ARTIFACTS=$(printf '%s\n' "${FILES[@]}" | xargs -n1 basename | tr '\n' ',' | sed 's/,$//')
          echo "artifact_names=$ARTIFACTS" >> $GITHUB_OUTPUT

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.tar.gz *.zip 2>/dev/null > checksums.txt || sha256sum *.tar.gz > checksums.txt
          cat checksums.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: weaviate-${{ github.event.inputs.version }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: weaviate-${{ github.event.inputs.version }}
          path: ./release-assets

      - name: List release assets
        run: ls -la ./release-assets/

      - name: Validate required binaries
        run: |
          chmod +x builds/common/validate-binaries.sh
          ./builds/common/validate-binaries.sh weaviate ./release-assets

      - name: Check GLIBC floor (Linux artifacts)
        run: |
          chmod +x builds/common/check-glibc-floor.sh
          ./builds/common/check-glibc-floor.sh weaviate ./release-assets

      - name: Check platform coverage
        run: |
          chmod +x builds/common/check-platform-coverage.sh
          ./builds/common/check-platform-coverage.sh weaviate "${{ github.event.inputs.version }}" "${{ github.event.inputs.platforms }}" ./release-assets

      # A partial-platform dispatch (platforms != all) only rebuilds the
      # checksums for what it built, and action-gh-release REPLACES the
      # release's checksums.txt rather than merging. releases.json is derived
      # from checksums.txt, so an unmerged partial upload silently drops every
      # platform this run did not touch. Merge the existing lines back in first.
      - name: Merge existing release checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x builds/common/merge-release-checksums.sh
          ./builds/common/merge-release-checksums.sh "weaviate-${{ github.event.inputs.version }}" ./release-assets/checksums.txt

      # action-gh-release uploaded all six assets CONCURRENTLY with no per-file
      # retry and published the release before anything was verified. On the
      # 2026-09-17 MariaDB wave that step failed or stalled on 5 of 8 attempts
      # ("Error saving asset", "Headers Timeout Error", "Error creating asset
      # temp dir", and a 46-minute stall on the 450 MB linux-x64 archive that a
      # hand-run `gh release upload` then finished in 44 seconds). The release
      # is now created as a DRAFT, every asset is uploaded one at a time with
      # retries, checksums.txt goes last, the upload is verified against it, and
      # only then is the release published.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ./release-notes
          cat >./release-notes/body.md <<'RELEASE_NOTES'
          ## Weaviate ${{ github.event.inputs.version }}

          Weaviate binaries repackaged for hostdb.

          ### Platforms
          - `linux-x64` - Linux x86_64
          - `linux-arm64` - Linux ARM64
          - `darwin-x64` - macOS x86_64
          - `darwin-arm64` - macOS Apple Silicon
          - `win32-x64` - Windows x64

          ### Usage
          ```bash
          # Download URL pattern
          https://github.com/${{ github.repository }}/releases/download/weaviate-${{ github.event.inputs.version }}/weaviate-${{ github.event.inputs.version }}-<platform>.tar.gz
          ```

          ### Checksums
          See `checksums.txt` for SHA256 checksums.
          RELEASE_NOTES

          chmod +x builds/common/publish-release.sh
          ./builds/common/publish-release.sh \
            --tag "weaviate-${{ github.event.inputs.version }}" \
            --title "Weaviate ${{ github.event.inputs.version }}" \
            --notes-file ./release-notes/body.md \
            --assets-dir ./release-assets

  upload-to-r2:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Upload to R2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: pnpm tsx scripts/upload-to-r2.ts --tag "weaviate-${{ github.event.inputs.version }}" --force

  update-releases:
    needs: upload-to-r2
    # releases.json is one shared file committed to main and pushed to R2, and
    # each run rebuilds the WHOLE manifest, so two of these at once is
    # last-writer-wins: the loser's version silently disappears from the
    # manifest. Serialize repo-wide across every engine.
    #
    # Trade-off: GitHub keeps only one PENDING entry per group, so a third
    # simultaneous manifest job would be evicted. That is the strictly better
    # failure: an evicted job leaves a version missing from releases.json, which
    # publish.yml's drift gate catches before anything ships and one
    # rebuild-releases.yml dispatch repairs, whereas the race it prevents
    # silently reverts an already-published version with nothing to catch it.
    concurrency:
      group: hostdb-releases-manifest
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      - name: Rebuild releases.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: pnpm tsx scripts/build-releases-json.ts --upload-r2

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add releases.json databases.json
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "chore: update releases.json"
          git pull --rebase origin main
          git push
