name: Release ClickHouse

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'ClickHouse version'
        required: true
        type: choice
        options:
          - 25.12.3.21
        default: 25.12.3.21
      platforms:
        description: 'Platforms to build'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'linux-x64'
          - 'linux-arm64'
          - 'darwin-x64'
          - 'darwin-arm64'

# Prevent concurrent runs that could conflict when updating releases.json
concurrency:
  group: release-clickhouse-${{ github.event.inputs.version }}
  cancel-in-progress: false

jobs:
  # Validate version against databases.json
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate version against databases.json
        run: |
          VERSION="${{ github.event.inputs.version }}"
          DB="clickhouse"

          echo "Validating ClickHouse version: $VERSION"

          # A version is enabled if its value is `true` or an object without `"enabled": false`
          ENABLED=$(jq -r "
            .databases.$DB.versions[\"$VERSION\"] // null
            | if . == null or . == false then \"false\"
              elif type == \"object\" and .enabled == false then \"false\"
              else \"true\"
            end
          " databases.json)
          if [ "$ENABLED" != "true" ]; then
            echo "::error::Version '$VERSION' is not enabled in databases.json"
            echo ""
            echo "Available versions:"
            jq -r "
              .databases.$DB.versions | to_entries
              | map(select(.value == true or ((.value | type) == \"object\" and (.value.enabled // true) == true)))
              | .[].key
            " databases.json
            exit 1
          fi

          echo "✓ Version $VERSION is enabled in databases.json"

      - name: Validate sources.json exists
        run: |
          DB="clickhouse"
          if [ ! -f "builds/$DB/sources.json" ]; then
            echo "::error::Missing builds/$DB/sources.json"
            exit 1
          fi
          echo "✓ builds/$DB/sources.json exists"

      - name: Validate version in sources.json
        run: |
          VERSION="${{ github.event.inputs.version }}"
          DB="clickhouse"

          HAS_VERSION=$(jq -r ".versions[\"$VERSION\"] // empty" "builds/$DB/sources.json")
          if [ -z "$HAS_VERSION" ]; then
            echo "::error::Version '$VERSION' not found in builds/$DB/sources.json"
            echo ""
            echo "Available versions in sources.json:"
            jq -r ".versions | keys[]" "builds/$DB/sources.json"
            exit 1
          fi

          echo "✓ Version $VERSION found in sources.json"

  # Determine which platforms to download based on input
  prepare:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Set download matrix
        id: set-matrix
        run: |
          PLATFORMS="${{ github.event.inputs.platforms }}"

          # ClickHouse only supports Linux and macOS (no Windows binaries)
          SUPPORTED_PLATFORMS='["linux-x64", "linux-arm64", "darwin-x64", "darwin-arm64"]'

          if [ "$PLATFORMS" = "all" ]; then
            MATRIX='[
              {"platform": "linux-x64", "runner": "ubuntu-latest"},
              {"platform": "linux-arm64", "runner": "ubuntu-latest"},
              {"platform": "darwin-x64", "runner": "macos-15-intel"},
              {"platform": "darwin-arm64", "runner": "macos-14"}
            ]'
          elif echo "$SUPPORTED_PLATFORMS" | jq -e "index(\"$PLATFORMS\")" > /dev/null; then
            # Single platform
            case "$PLATFORMS" in
              linux-x64|linux-arm64)
                MATRIX="[{\"platform\": \"$PLATFORMS\", \"runner\": \"ubuntu-latest\"}]"
                ;;
              darwin-x64)
                MATRIX="[{\"platform\": \"$PLATFORMS\", \"runner\": \"macos-15-intel\"}]"
                ;;
              darwin-arm64)
                MATRIX="[{\"platform\": \"$PLATFORMS\", \"runner\": \"macos-14\"}]"
                ;;
            esac
          else
            echo "::error::Unknown platform: $PLATFORMS"
            exit 1
          fi

          # Compact the JSON for output
          MATRIX=$(echo "$MATRIX" | jq -c .)
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "Platforms: $MATRIX"

  # Download and repackage official binaries (Linux + macOS)
  build-download:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download and repackage binary
        id: download
        timeout-minutes: 30
        run: |
          VERSION="${{ github.event.inputs.version }}"
          PLATFORM="${{ matrix.platform }}"

          echo "Downloading ClickHouse $VERSION for $PLATFORM"

          pnpm download:clickhouse -- \
            --version "$VERSION" \
            --platform "$PLATFORM" \
            --output ./dist

          # Check if artifact was created
          shopt -s nullglob
          FILES=(./dist/clickhouse-*.tar.gz)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "::error::No artifact created for $PLATFORM"
            exit 1
          fi
          ls -la ./dist/

      - name: Generate checksum
        shell: bash
        run: |
          cd dist
          shopt -s nullglob
          for f in *.tar.gz *.zip; do
            if [ -f "$f" ]; then
              if command -v sha256sum &> /dev/null; then
                sha256sum "$f" >> checksums.txt
              else
                # macOS uses shasum
                shasum -a 256 "$f" >> checksums.txt
              fi
            fi
          done
          cat checksums.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: clickhouse-${{ github.event.inputs.version }}-${{ matrix.platform }}
          path: |
            dist/*.tar.gz
            dist/checksums.txt
          retention-days: 1

  # Collect all artifacts and create release
  # Note: Windows builds are not supported for ClickHouse. See builds/clickhouse/build-windows.sh
  # for experimental build script if Windows support is ever attempted.
  release:
    needs: [build-download]
    if: needs.build-download.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check if any artifacts exist
        id: check-artifacts
        run: |
          # We'll check after downloading
          echo "Checking for artifacts..."

      - name: Download download-job artifacts
        if: needs.build-download.result == 'success'
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          pattern: clickhouse-${{ github.event.inputs.version }}-*

      - name: Prepare release assets
        id: prepare
        run: |
          mkdir -p ./release-assets

          # Move all artifacts to release-assets, flattening the directory structure
          if [ -d ./artifacts ]; then
            find ./artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec mv {} ./release-assets/ \; 2>/dev/null || true

            # Combine all checksums
            find ./artifacts -name "checksums.txt" -exec cat {} \; > ./release-assets/checksums.txt 2>/dev/null || true
          fi

          echo "Release assets:"
          ls -la ./release-assets/ || echo "No release assets found"

          # Check if we have at least one artifact
          shopt -s nullglob
          FILES=(./release-assets/*.tar.gz ./release-assets/*.zip)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "::error::No artifacts were created for any platform"
            echo "has-artifacts=false" >> $GITHUB_OUTPUT
            exit 1
          fi

          echo "has-artifacts=true" >> $GITHUB_OUTPUT

          echo ""
          echo "Checksums:"
          cat ./release-assets/checksums.txt || echo "No checksums"

      - name: Validate required binaries
        if: steps.prepare.outputs.has-artifacts == 'true'
        run: |
          chmod +x builds/common/validate-binaries.sh
          ./builds/common/validate-binaries.sh clickhouse ./release-assets

      - name: Check GLIBC floor (Linux artifacts)
        if: steps.prepare.outputs.has-artifacts == 'true'
        run: |
          chmod +x builds/common/check-glibc-floor.sh
          ./builds/common/check-glibc-floor.sh clickhouse ./release-assets

      - name: Check platform coverage
        if: steps.prepare.outputs.has-artifacts == 'true'
        run: |
          chmod +x builds/common/check-platform-coverage.sh
          ./builds/common/check-platform-coverage.sh clickhouse "${{ github.event.inputs.version }}" "${{ github.event.inputs.platforms }}" ./release-assets

      # A partial-platform dispatch (platforms != all) only rebuilds the
      # checksums for what it built, and action-gh-release REPLACES the
      # release's checksums.txt rather than merging. releases.json is derived
      # from checksums.txt, so an unmerged partial upload silently drops every
      # platform this run did not touch. Merge the existing lines back in first.
      - name: Merge existing release checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x builds/common/merge-release-checksums.sh
          ./builds/common/merge-release-checksums.sh "clickhouse-${{ github.event.inputs.version }}" ./release-assets/checksums.txt

      # action-gh-release uploaded all six assets CONCURRENTLY with no per-file
      # retry and published the release before anything was verified. On the
      # 2026-09-17 MariaDB wave that step failed or stalled on 5 of 8 attempts
      # ("Error saving asset", "Headers Timeout Error", "Error creating asset
      # temp dir", and a 46-minute stall on the 450 MB linux-x64 archive that a
      # hand-run `gh release upload` then finished in 44 seconds). The release
      # is now created as a DRAFT, every asset is uploaded one at a time with
      # retries, checksums.txt goes last, the upload is verified against it, and
      # only then is the release published.
      - name: Publish release
        if: steps.prepare.outputs.has-artifacts == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ./release-notes
          cat >./release-notes/body.md <<'RELEASE_NOTES'
          ## ClickHouse ${{ github.event.inputs.version }}

          ClickHouse binaries for hostdb.

          ClickHouse is a column-oriented database for real-time analytics and big data processing.

          ### Available Platforms
          | Platform | Source |
          |----------|--------|
          | `linux-x64` | Official binary (GitHub releases) |
          | `linux-arm64` | Official binary (GitHub releases) |
          | `darwin-x64` | Official binary (GitHub releases) |
          | `darwin-arm64` | Official binary (GitHub releases) |

          **Note:** ClickHouse does not officially support Windows. For Windows use, consider WSL.

          ### Usage
          ```bash
          # Download URL pattern
          https://github.com/${{ github.repository }}/releases/download/clickhouse-${{ github.event.inputs.version }}/clickhouse-${{ github.event.inputs.version }}-<platform>.tar.gz
          ```

          ### Checksums
          See `checksums.txt` for SHA256 checksums.

          ### License
          ClickHouse is licensed under Apache-2.0.

          ### Sources
          - **Official**: [github.com/ClickHouse/ClickHouse](https://github.com/ClickHouse/ClickHouse)
          RELEASE_NOTES

          chmod +x builds/common/publish-release.sh
          ./builds/common/publish-release.sh \
            --tag "clickhouse-${{ github.event.inputs.version }}" \
            --title "ClickHouse ${{ github.event.inputs.version }}" \
            --notes-file ./release-notes/body.md \
            --assets-dir ./release-assets

  # Update the releases manifest
  upload-to-r2:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Upload to R2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: pnpm tsx scripts/upload-to-r2.ts --tag "clickhouse-${{ github.event.inputs.version }}" --force

  update-releases:
    needs: upload-to-r2
    # releases.json is one shared file committed to main and pushed to R2, and
    # each run rebuilds the WHOLE manifest, so two of these at once is
    # last-writer-wins: the loser's version silently disappears from the
    # manifest. Serialize repo-wide across every engine.
    #
    # Trade-off: GitHub keeps only one PENDING entry per group, so a third
    # simultaneous manifest job would be evicted. That is the strictly better
    # failure: an evicted job leaves a version missing from releases.json, which
    # publish.yml's drift gate catches before anything ships and one
    # rebuild-releases.yml dispatch repairs, whereas the race it prevents
    # silently reverts an already-published version with nothing to catch it.
    concurrency:
      group: hostdb-releases-manifest
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      - name: Rebuild releases.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: pnpm tsx scripts/build-releases-json.ts --upload-r2

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add releases.json databases.json
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "chore: update releases.json"
          git pull --rebase origin main
          git push
