name: Probe DocumentDB native Windows gateway
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/probe-documentdb-windows.yml'
permissions:
  contents: read
jobs:
  gateway:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          repository: documentdb/documentdb
          ref: b0cb0dae85e8746f4e0b79c847894179b2f80d64
      - uses: msys2/setup-msys2@v2
        id: msys
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-openssl mingw-w64-x86_64-pkgconf
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.95 --profile minimal --target x86_64-pc-windows-gnu
      - name: Check unmodified GA gateway on native Windows
        shell: pwsh
        env:
          OPENSSL_DIR: ${{ steps.msys.outputs.msys2-location }}\mingw64
          CARGO_BUILD_JOBS: '3'
        run: |
          $env:PATH = "$env:OPENSSL_DIR\bin;$env:PATH"
          Set-Location pg_documentdb_gw
          cargo +1.95 check --locked --target x86_64-pc-windows-gnu -p documentdb_gateway
