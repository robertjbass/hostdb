      9.6.0:
        note: mysqlpump removed in MySQL 9.0; 9.x uses mysqldump only
        cli_tools:
          server: mysqld
          client: mysql
          utilities:
            - mysqldump
            - mysqladmin
          enhanced:
            - mycli
            - usql
      9.5.0:
        deprecated: true
        note: Deprecated; superseded by 9.6.0. mysqlpump removed in MySQL 9.0.
        cli_tools:
          server: mysqld
          client: mysql
          utilities:
