    versions:
      3.10.5: true
      3.8.0: true
    platforms:
      - linux-x64
      - linux-arm64
      - darwin-x64
      - darwin-arm64
      - win32-x64
    cli_tools:
      server: influxdb3
      client: null
      utilities: []
      enhanced: []
      note: HTTP API; use official SDKs or SQL via CLI
    connection:
      runtime: server
      default_port: 8086
      scheme: http
      default_database: null
      default_user: null
      query_language: SQL
    spindb_status: completed
  libsql:
    display_name: libSQL
    description: SQLite fork by Turso with server mode (sqld), HTTP API, replication, and embedded replica support
    type: Embedded SQL
    source_repo: https://github.com/tursodatabase/libsql
    license: MIT
    commercial_use: true
    hosted_service_allowed: true
    protocol: sqlite
    note: Windows binaries unavailable. Require WSL.
    defaults:
      '0': '0.24.32'
    versions:
      0.24.32: true
    platforms:
      - linux-x64
      - linux-arm64
      - darwin-x64
      - darwin-arm64
    cli_tools:
      server: sqld
      client: null
      utilities: []
      enhanced:
        - litecli
        - usql
      note: HTTP API; use Turso client SDKs or any libSQL/SQLite client
    connection:
      runtime: server
      default_port: 8080
      scheme: http
      default_database: null
      default_user: null
      query_language: SQL
    spindb_status: in-progress
  mariadb:
    display_name: MariaDB
    description: Community-developed fork of MySQL with enhanced performance, storage engines, and features
    type: Relational
    source_repo: https://github.com/MariaDB/server
    license: GPL-2.0
    commercial_use: true
    hosted_service_allowed: true
    protocol: null
    note: ''
