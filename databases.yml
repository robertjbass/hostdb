    defaults:
      '7': '7.0.39'
      # '8' deliberately pins the 8.0 LTS line, NOT the highest 8.x. Without this
      # entry a bare '8' would prefix-match into 8.2.x. See lib/resolver.ts.
      '8': '8.0.28'
    versions:
      8.2.12: true
      8.2.9: true
      8.2.3: true
      8.0.28: true
      8.0.23: true
      8.0.17: true
      7.0.39: true
      7.0.34: true
      7.0.28: true
    platforms:
      - linux-x64
      - linux-arm64
      - darwin-x64
      - darwin-arm64
      - win32-x64
    cli_tools:
      server: mongod
      client: mongosh
      utilities:
        - mongodump
        - mongorestore
        - mongoexport
        - mongoimport
      enhanced: []
