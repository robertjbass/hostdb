          - linux-x64
          - linux-arm64
          - darwin-x64
          - darwin-arm64
        dependencies:
          - database: postgresql-documentdb
            cascade_delete: true
            note: FerretDB v2 uses postgresql-documentdb as its backend; removing FerretDB also removes postgresql-documentdb
      '1.24.2':
        dependencies:
          - database: postgresql
            cascade_delete: false
            note: FerretDB v1 uses plain PostgreSQL; PostgreSQL remains installed when FerretDB is removed
    platforms:
      - linux-x64
      - linux-arm64
      - darwin-x64
      - darwin-arm64
      - win32-x64
    cli_tools:
      server: ferretdb
      client: mongosh
      utilities:
        - mongodump
        - mongorestore
      enhanced: []
    connection:
      runtime: server
      default_port: 27017
      scheme: mongodb
      default_database: test
      default_user: null
      query_language: MQL
    spindb_status: completed
  influxdb:
    display_name: InfluxDB
    description: Purpose-built time-series database with SQL support, rewritten in Rust for InfluxDB 3.0
    type: Time-series
    source_repo: https://github.com/influxdata/influxdb
    license: Apache-2.0 AND MIT
    commercial_use: true
    hosted_service_allowed: true
    protocol: null
    note: v3.0 is a Rust rewrite using Apache Arrow/DataFusion. Single binary with bundled Python runtime for plugin system. Most popular time-series database by adoption.
    defaults:
